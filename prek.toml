# Git hooks managed by prek (https://prek.j178.dev). Set up once per clone:
#   prek install
# Run every hook on every file:
#   prek run --all-files
# CI runs the same hooks with j178/prek-action.

minimum_prek_version = "0.4.0"
default_install_hook_types = ["pre-commit", "commit-msg"]

# File hygiene, built into prek. Hooks without `stages` run in every stage,
# including commit-msg, where they would check the message file; so the file
# hooks here and ShellCheck below are limited to pre-commit.
[[repos]]
repo = "builtin"
hooks = [
  { id = "trailing-whitespace", stages = ["pre-commit"] },
  { id = "end-of-file-fixer", stages = ["pre-commit"] },
  { id = "mixed-line-ending", args = ["--fix=lf"], stages = ["pre-commit"] },
  { id = "check-yaml", stages = ["pre-commit"] },
  { id = "check-toml", stages = ["pre-commit"] },
  { id = "check-json", stages = ["pre-commit"] },
  { id = "check-merge-conflict", stages = ["pre-commit"] },
  { id = "check-added-large-files", stages = ["pre-commit"] },
  { id = "check-executables-have-shebangs", stages = ["pre-commit"] },
  { id = "check-shebang-scripts-are-executable", stages = ["pre-commit"] },
  { id = "detect-private-key", stages = ["pre-commit"] },
]

# ShellCheck on every shell script, including tests/fake-z2m, which has no
# extension and is recognised by its shebang.
[[repos]]
repo = "https://github.com/shellcheck-py/shellcheck-py"
rev = "v0.11.0.1"
hooks = [{ id = "shellcheck", stages = ["pre-commit"] }]

# Conventional Commits, checked by commitlint with commitlint.config.mjs; see
# CONTRIBUTING.md. Needs Node.js, which prek uses from the system or installs.
# CI runs the same hook on every pushed commit
# (.github/scripts/check-commit-messages.sh). The upstream hook reads
# .git/COMMIT_EDITMSG; pass_filenames makes it check the file prek passes, so
# `prek run --commit-msg-filename` works too.
[[repos]]
repo = "https://github.com/alessandrojcm/commitlint-pre-commit-hook"
rev = "v9.27.0"
hooks = [
  { id = "commitlint", stages = ["commit-msg"], pass_filenames = true, additional_dependencies = ["@commitlint/config-conventional@21.2.3"] },
]
